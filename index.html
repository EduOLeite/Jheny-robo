<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achadinhos da Jheny - Painel de Ofertas</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="logo-container">
        <img src="logo.png" alt="Achadinhos da Jheny Logo" class="brand-logo">
      </div>
      <h1>Achadinhos da <span>Jheny</span></h1>
      <p>Busque as melhores ofertas do Mercado Livre e envie direto para o Telegram!</p>
    </header>

    <section class="search-section">
      <div class="search-box">
        <div class="input-group search-input-group">
          <label for="searchInput">O que deseja buscar?</label>
          <input type="text" id="searchInput" placeholder="Ex: smartwatch, maquiagem, vestido...">
        </div>

        <div class="input-group limit-input-group">
          <label for="limitInput">Qtd. Produtos</label>
          <input type="number" id="limitInput" min="1" max="50" value="10">
        </div>

        <button id="searchBtn" onclick="buscarProdutos()">✨ Buscar Promoções</button>
      </div>
    </section>

    <div id="statusMessage" class="status-message"></div>

    <!-- Grade de Produtos Encontrados -->
    <section id="resultsGrid" class="results-grid"></section>
  </div>

  <!-- Modal para Detalhes e Envio ao Telegram -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharModal()">&times;</span>
      <div class="modal-body">
        <img id="modalImg" src="" alt="Produto">
        <div class="modal-info">
          <h3 id="modalTitle">Título do Produto</h3>
          <div class="price-tag" id="modalPrice">R$ 0,00</div>
          
          <label for="modalLink">Link do Produto:</label>
          <input type="text" id="modalLink" readonly>

          <div class="modal-actions">
            <a id="modalMlBtn" href="#" target="_blank" class="btn-ml">🔗 Abrir no Mercado Livre</a>
            <button id="modalTelegramBtn" class="btn-telegram" onclick="enviarParaTelegram()">✈️ Enviar para o Telegram</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
